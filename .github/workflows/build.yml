name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653 build-tools;33.0.1 platforms;android-33'

      - name: Compilar C++ com NDK
        run: |
          set -e
          NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DPLATFORM=Android \
            -DGRAPHICS=GRAPHICS_API_OPENGL_ES2
          make -j$(nproc)

      - name: Gerar e Assinar APK
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.1"
          PLATFORM_JAR="$ANDROID_HOME/platforms/android-33/android.jar"

          mkdir -p apk_root/lib/arm64-v8a apk_root/assets
          if [ -d "assets" ]; then cp -r assets/* apk_root/assets/; fi
          cp build/libmain.so apk_root/lib/arm64-v8a/

          # Empacotar APK diretamente
          $BUILD_TOOLS/aapt package -f -M AndroidManifest.xml -A apk_root/assets -I $PLATFORM_JAR -F base.apk
          
          cd apk_root
          $BUILD_TOOLS/aapt add ../base.apk lib/arm64-v8a/libmain.so
          cd ..

          $BUILD_TOOLS/zipalign -f 4 base.apk FlappyBird_Unaligned.apk
          keytool -genkeypair -v -keystore release.keystore -alias game -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Dev" -noprompt
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:123456 --out FlappyBird.apk FlappyBird_Unaligned.apk

      - name: Guardar o APK Final
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-APK
          path: FlappyBird.apk

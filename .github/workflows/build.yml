name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653 build-tools;33.0.1 platforms;android-33'

      - name: Compilar Raylib e Gerar APK
        run: |
          set -e

          NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.1"
          PLATFORM_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "1. Clonando Raylib 5.0..."
          git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git raylib_src

          echo "2. Compilando Raylib NDK..."
          mkdir build_raylib && cd build_raylib
          cmake ../raylib_src/src \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DPLATFORM=Android \
            -DGRAPHICS=GRAPHICS_API_OPENGL_ES2
          make -j$(nproc)
          cd ..

          echo "3. Estruturando o APK..."
          mkdir -p apk_structure/lib/arm64-v8a
          mkdir -p apk_structure/assets

          if [ -d "assets" ]; then
            cp -r assets/* apk_structure/assets/
          fi

          echo "4. Compilando main.cpp com preservacao de simbolos NativeActivity..."
          $TOOLCHAIN/aarch64-linux-android21-clang++ \
            -shared -fPIC main.cpp \
            -Iraylib_src/src \
            -Wl,-u,ANativeActivity_onCreate \
            build_raylib/libraylib.a \
            -lGLESv2 -lEGL -landroid -llog -lm -lc -lpthread \
            -DPLATFORM_ANDROID \
            -o apk_structure/lib/arm64-v8a/libmain.so

          echo "5. Criando pacote com aapt..."
          $BUILD_TOOLS/aapt package -f -M AndroidManifest.xml -A apk_structure/assets -I $PLATFORM_JAR -F unaligned.apk

          echo "6. Adicionando biblioteca nativa libmain.so..."
          cd apk_structure
          $BUILD_TOOLS/aapt add ../unaligned.apk lib/arm64-v8a/libmain.so
          cd ..

          echo "7. Alinhando ficheiros com zipalign..."
          $BUILD_TOOLS/zipalign -f 4 unaligned.apk aligned.apk

          echo "8. Assinando APK..."
          keytool -genkeypair -v -keystore release.keystore -alias game -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Dev" -noprompt
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:123456 --out FlappyBird_Funcional.apk aligned.apk

      - name: Guardar o APK Final
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-APK
          path: FlappyBird_Funcional.apk

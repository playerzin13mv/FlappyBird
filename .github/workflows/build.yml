name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar NDK e Compilar APK
        run: |
          # 1. Instalar NDK e ferramentas do Android
          echo "y" | sdkmanager --licenses || true
          sdkmanager "ndk;25.2.9519653" "build-tools;33.0.1" "platforms;android-33"
          
          NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.1"
          
          # 2. Clonar o código-fonte da Raylib 5.0
          git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git raylib_src
          
          # 3. Compilar a Raylib para Android (arm64-v8a)
          mkdir build_raylib && cd build_raylib
          cmake ../raylib_src/src \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DPLATFORM=Android \
            -DGRAPHICS=GRAPHICS_API_OPENGL_ES2
          make -j$(nproc)
          cd ..

          # 4. Estruturar o projeto do APK
          mkdir -p apk_build/lib/arm64-v8a apk_build/assets apk_build/res/mipmap-hdpi
          cp -r assets/* apk_build/assets/
          
          # 5. Compilar o main.cpp com o Clang do NDK
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ \
            -shared -fPIC main.cpp \
            -Iraylib_src/src \
            -I$NDK_PATH/sources/android/native_app_glue \
            $NDK_PATH/sources/android/native_app_glue/android_native_app_glue.c \
            build_raylib/libraylib.a \
            -lGLESv2 -lEGL -landroid -llog -lm -lc -lpthread \
            -DPLATFORM_ANDROID \
            -o apk_build/lib/arm64-v8a/libmain.so

          # 6. Criar AndroidManifest.xml
          cat << 'MANIFEST' > apk_build/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.meujogo.flappybird"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33"/>
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <application android:label="Flappy Bird" android:hasCode="false">
                  <activity android:name="android.app.NativeActivity"
                      android:label="Flappy Bird"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:exported="true">
                      <meta-data android:name="android.app.lib_name" android:value="main" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          # 7. Empacotar e assinar o APK
          $BUILD_TOOLS/aapt package -f -M apk_build/AndroidManifest.xml -S apk_build/res -A apk_build/assets -I $ANDROID_HOME/platforms/android-33/android.jar -F raw.apk
          cd apk_build && $BUILD_TOOLS/aapt add ../raw.apk lib/arm64-v8a/libmain.so && cd ..
          
          keytool -genkey -v -keystore release.keystore -alias game -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Dev"
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:123456 --out FlappyBird_Funcional.apk raw.apk

      - name: Guardar o APK Final
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-APK
          path: FlappyBird_Funcional.apk

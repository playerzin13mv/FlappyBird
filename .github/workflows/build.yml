name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653 build-tools;33.0.1 platforms;android-33'

      - name: Compilar C++ com NDK
        run: |
          set -e
          NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          rm -rf build_cmake
          mkdir build_cmake && cd build_cmake
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DPLATFORM=Android \
            -DGRAPHICS=GRAPHICS_API_OPENGL_ES2
          make -j$(nproc)

      - name: Empacotar e Assinar APK com Ícone e Assets
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.1"
          PLATFORM_JAR="$ANDROID_HOME/platforms/android-33/android.jar"

          # Criar pasta de recursos e ícone
          mkdir -p res/drawable res/values
          
          # Se existir um ícone no repositório, usa-o; se não, cria um placeholder
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png res/drawable/icon.png
          else
            # Ícone temporário
            wget -O res/drawable/icon.png "https://raw.githubusercontent.com/raysan5/raylib/master/logo/raylib_32x32.png" || touch res/drawable/icon.png
          fi

          cat << 'STR' > res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Flappy Bird</string>
          </resources>
          STR

          # Empacotar APK base com os recursos gráficos (res)
          $BUILD_TOOLS/aapt package -f -m -J . -M AndroidManifest.xml -S res -I $PLATFORM_JAR -F base.apk

          # Adicionar biblioteca nativa e assets
          mkdir -p lib/arm64-v8a
          cp build_cmake/libmain.so lib/arm64-v8a/
          
          # Copiar assets para dentro do APK de forma estruturada
          if [ -d "assets" ]; then
            mkdir -p assets_tmp
            cp -r assets/* assets_tmp/
            cd assets_tmp
            $BUILD_TOOLS/aapt add ../base.apk $(find . -type f)
            cd ..
          fi
          
          $BUILD_TOOLS/aapt add base.apk lib/arm64-v8a/libmain.so

          # Alinhar e assinar
          $BUILD_TOOLS/zipalign -v -f 4 base.apk FlappyBird_aligned.apk
          keytool -genkeypair -v -keystore release.keystore -alias game -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Dev" -noprompt
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:123456 --out FlappyBird.apk FlappyBird_aligned.apk

      - name: Guardar o APK Final
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-APK
          path: FlappyBird.apk

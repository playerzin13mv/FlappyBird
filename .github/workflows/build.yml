name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653 build-tools;33.0.1 platforms;android-33'

      - name: Compilar C++ com NDK
        run: |
          set -e
          NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          rm -rf build_cmake
          mkdir build_cmake && cd build_cmake
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DPLATFORM=Android \
            -DGRAPHICS=GRAPHICS_API_OPENGL_ES2
          make -j$(nproc)

      - name: Empacotar e Assinar APK Sem Erros
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.1"
          PLATFORM_JAR="$ANDROID_HOME/platforms/android-33/android.jar"

          # Criar APK base apenas com o manifesto (sem pasta res com imagens corrompidas)
          $BUILD_TOOLS/aapt package -f -M AndroidManifest.xml -I $PLATFORM_JAR -F base.apk

          # Adicionar a biblioteca compilada libmain.so
          mkdir -p lib/arm64-v8a
          cp build_cmake/libmain.so lib/arm64-v8a/
          $BUILD_TOOLS/aapt add base.apk lib/arm64-v8a/libmain.so

          # Adicionar todos os assets (background.png, bird.png, pipe.png, etc) diretamente na raiz do APK
          if [ -d "assets" ]; then
            cd assets
            $BUILD_TOOLS/aapt add ../base.apk *
            cd ..
          fi

          # Alinhar e Assinar APK
          $BUILD_TOOLS/zipalign -v -f 4 base.apk FlappyBird_aligned.apk
          keytool -genkeypair -v -keystore release.keystore -alias game -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Dev" -noprompt
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:123456 --out FlappyBird.apk FlappyBird_aligned.apk

      - name: Guardar o APK Final
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-APK
          path: FlappyBird.apk
